<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Essentials — PadilhaSec</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>

<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-logo">
      <svg viewBox="0 0 32 32" fill="none" style="width:44px;height:44px;margin-bottom:4px;">
        <rect width="32" height="32" rx="8" fill="#00c8ff" fill-opacity=".12"/>
        <path d="M11 15V11.5a5 5 0 0 1 10 0V15" stroke="#00c8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="7.5" y="15" width="17" height="12" rx="3" fill="#7c3aed" fill-opacity=".25" stroke="#7c3aed" stroke-width="1.8"/>
        <circle cx="16" cy="20.5" r="2" fill="#00c8ff"/>
        <rect x="14.9" y="20.5" width="2.2" height="3" rx="1.1" fill="#00c8ff"/>
      </svg>
      Padilha<span>Sec</span>
    </div>
    <div class="loading-spinner"></div>
    <div id="loadingMsg" style="display:none"></div>
  </div>

  <div class="app">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-logo">
        <a href="index.html" class="topbar-back" title="Voltar ao início">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18">
            <path d="M12 15L7 10L12 5" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <svg viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#00c8ff" fill-opacity=".12" />
          <path d="M10 13V10a4 4 0 0 1 8 0v3" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="7" y="13" width="14" height="10" rx="2.5" fill="#7c3aed" fill-opacity=".25" stroke="#7c3aed" stroke-width="1.5"/>
          <circle cx="14" cy="18" r="1.5" fill="#00c8ff"/>
          <rect x="13.2" y="18" width="1.6" height="2.5" rx=".8" fill="#00c8ff"/>
        </svg>
        <span class="topbar-title">Padilha<span>Sec</span></span>
      </div>
      <div class="topbar-right">
        <div class="pyodide-status">
          <div class="pyodide-dot" id="pyodideDot"></div>
          <span id="pyodideLabel">Carregando Python…</span>
        </div>
        <span class="topbar-module">Módulo: Python Essentials</span>
      </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Python Essentials</div>
        <div id="lessonList"></div>
      </div>
      <div class="sidebar-progress">
        <div class="progress-label">
          <span>Progresso</span>
          <span id="progressText">0 / 8</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="lesson-header" id="lessonHeader">
        <div class="lesson-header-top">
          <h2 id="lessonTitle"></h2>
          <span class="lesson-tag" id="lessonTagBadge"></span>
        </div>
        <p id="lessonDesc"></p>
      </div>

      <div class="content-area" id="contentArea"></div>

      <div style="display:none">
        <button id="btnPrev"></button>
        <button id="btnComplete"></button>
        <button id="btnNext"></button>
      </div>
    </main>

  </div>

  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>

  <style>
    .topbar-back {
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
      transition: background .15s;
      margin-right: 4px;
    }
    .topbar-back:hover { background: rgba(255,255,255,.06); }
  </style>

</body>

</html>
